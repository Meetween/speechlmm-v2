### model
model_name_or_path: /path/to/SpeechLMM-v2.0-L-7B
trust_remote_code: true
use_speechlmm_wrapper: true

### method — Thinker attention + dense FFN LoRA (SpeechLMM-v2 L)
stage: sft
do_train: true
finetuning_type: lora
freeze_vision_tower: true
freeze_talker: true
freeze_code2wav: true
freeze_code_predictor: true
deepspeed: examples/deepspeed/ds_z3_config.json
gradient_checkpointing_all_layers: true

### language model (Thinker) attention + gate/up/down_proj + lm_head
lora_language_model_scope: attention_and_ffn
lora_language_model_rank: 8
lora_language_model_alpha: 16

### dataset
dataset: dummy_audio_sft_train
dataset_dir: data
template: speechlmm
cutoff_len: 512
preprocessing_num_workers: 1
dataloader_num_workers: 1
dataloader_drop_last: false

### output
output_dir: output/lora_thinker_attention_and_ffn
logging_steps: 1
save_steps: 500
plot_loss: false
overwrite_output_dir: true
save_only_model: false
report_to: none
run_name: lora-thinker-attention-and-ffn

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
max_steps: 5
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_steps: 1
bf16: true
ddp_timeout: 180000000
