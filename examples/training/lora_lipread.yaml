### model
model_name_or_path: /path/to/Qwen3-Omni-30B-A3B-Instruct
trust_remote_code: true
use_speechlmm_wrapper: true

### method — component LoRA on lipread encoder + adapter (for visual speech recognition)
stage: sft
do_train: true
finetuning_type: lora
freeze_vision_tower: true
freeze_language_model: true
freeze_talker: true
freeze_code2wav: true
freeze_code_predictor: true
deepspeed: examples/deepspeed/ds_z3_config.json
gradient_checkpointing_all_layers: true

### lipread encoder LoRA
lora_lipread_encoder: true
lora_lipread_encoder_rank: 8
lora_lipread_encoder_alpha: 16

### lipread adapter LoRA
lora_lipread_adapter: true
lora_lipread_adapter_rank: 8
lora_lipread_adapter_alpha: 16

### dataset
dataset: dummy_audio_sft_train
dataset_dir: data
template: speechlmm
cutoff_len: 512
preprocessing_num_workers: 1
dataloader_num_workers: 1
dataloader_drop_last: false

### output
output_dir: output/lora_lipread
logging_steps: 1
save_steps: 500
plot_loss: false
overwrite_output_dir: true
save_only_model: false
report_to: none
run_name: lora-lipread

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
max_steps: 5
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_steps: 1
bf16: true
ddp_timeout: 180000000
